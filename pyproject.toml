[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pizzaz-mcp-server"
version = "0.1.0"
description = "Pizzaz demo MCP server implemented with the Python FastMCP helper"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MCP Team", email = "team@example.com"},
]
keywords = ["mcp", "server", "fastapi", "demo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/modelcontextprotocol/servers"
Repository = "https://github.com/modelcontextprotocol/servers"
Documentation = "https://github.com/modelcontextprotocol/servers/tree/main/src/pizzaz"

[project.scripts]
pizzaz-server = "main:app"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["."]